name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: YouTubeDownloader-Windows.exe
            pyinstaller_name: YouTubeDownloader-Windows
          - os: macos-latest
            platform: macos
            artifact_name: YouTubeDownloader-macOS.zip
            pyinstaller_name: YouTubeDownloader-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
          pip install -U yt-dlp yt-dlp-ejs

      - name: Run unit tests
        shell: bash
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      # After tests: local ffmpeg would otherwise shadow PATH in tool-resolution tests.
      - name: Install deno + ffmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .
          if (-not (Test-Path deno.exe)) {
            Get-ChildItem -Recurse -Filter deno.exe | Select-Object -First 1 | Move-Item -Destination deno.exe
          }
          # BtbN builds are more reliable than gyan.dev on CI
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Copy-Item "$($ffmpegDir.Name)\bin\ffmpeg.exe" ffmpeg.exe
          Copy-Item "$($ffmpegDir.Name)\bin\ffprobe.exe" ffprobe.exe
          if (-not (Test-Path ffmpeg.exe)) { throw "ffmpeg.exe missing after extract" }

      - name: Install deno + ffmpeg (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install ffmpeg deno
          cp "$(brew --prefix)/bin/ffmpeg" ./ffmpeg
          cp "$(brew --prefix)/bin/ffprobe" ./ffprobe
          cp "$(brew --prefix)/bin/deno" ./deno
          chmod +x ffmpeg ffprobe deno
          ./ffmpeg -version | head -1
          ./deno --version | head -1

      - name: Smoke test
        shell: bash
        run: python smoke_test.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build EXE (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name "${{ matrix.pyinstaller_name }}" `
            --icon "assets\icon.ico" `
            --add-data "VERSION;." `
            --add-data "assets;assets" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-binary "deno.exe;." `
            --collect-all yt_dlp `
            --collect-all yt_dlp_ejs `
            --collect-all curl_cffi `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtGui `
            --hidden-import platforms `
            --hidden-import platforms.youtube `
            --hidden-import platforms.bilibili `
            --hidden-import platforms.tiktok `
            --hidden-import theme `
            --hidden-import pacing `
            --hidden-import gui_log `
            --hidden-import batch_io `
            --hidden-import yt_dlp_updater `
            main.py

      - name: Build app (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS 用 onedir：onefile + .app 已被 PyInstaller 标记弃用（v7 报错），
          # 且每次启动都要解包上百 MB。打出来的 zip 体积基本一致。
          pyinstaller --onedir --windowed \
            --name "${{ matrix.pyinstaller_name }}" \
            --osx-bundle-identifier "com.jqsfree.youtubedownloader" \
            --icon "assets/icon.icns" \
            --add-data "VERSION:." \
            --add-data "assets:assets" \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --add-binary "deno:." \
            --collect-all yt_dlp \
            --collect-all yt_dlp_ejs \
            --collect-all curl_cffi \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtGui \
            --hidden-import platforms \
            --hidden-import platforms.youtube \
            --hidden-import platforms.bilibili \
            --hidden-import platforms.tiktok \
            --hidden-import theme \
            --hidden-import pacing \
            --hidden-import gui_log \
            --hidden-import batch_io \
            --hidden-import yt_dlp_updater \
            main.py
          ls -la dist/
          # --windowed on macOS → .app; zip for release download
          if [ -d "dist/${{ matrix.pyinstaller_name }}.app" ]; then
            ditto -c -k --keepParent \
              "dist/${{ matrix.pyinstaller_name }}.app" \
              "dist/${{ matrix.artifact_name }}"
          elif [ -f "dist/${{ matrix.pyinstaller_name }}" ]; then
            ditto -c -k \
              "dist/${{ matrix.pyinstaller_name }}" \
              "dist/${{ matrix.artifact_name }}"
          else
            echo "No macOS build output found in dist/" >&2
            exit 1
          fi
          ls -la "dist/${{ matrix.artifact_name }}"

      - name: Write checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Write checksums (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd dist
          shasum -a 256 "${{ matrix.artifact_name }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pyinstaller_name }}-v${{ steps.version.outputs.version }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Stage release files
        id: stage
        run: |
          mkdir -p staged
          find release-assets -type f \( -name 'YouTubeDownloader-*' -o -name '*.exe' -o -name '*.zip' \) -print
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "staged/$base"
          done < <(find release-assets -type f \( \
            -name 'YouTubeDownloader-Windows.exe' -o \
            -name 'YouTubeDownloader-macOS.zip' \
          \) -print0)
          ls -la staged
          test -f staged/YouTubeDownloader-Windows.exe
          test -f staged/YouTubeDownloader-macOS.zip
          # 每个平台各上传一份 SHA256SUMS.txt，合并成一份清单
          find release-assets -name 'SHA256SUMS.txt' -exec cat {} + > staged/SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat staged/SHA256SUMS.txt
          grep -q 'YouTubeDownloader-Windows.exe' staged/SHA256SUMS.txt
          grep -q 'YouTubeDownloader-macOS.zip' staged/SHA256SUMS.txt
          echo "files=$(find staged -type f | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Multi-Platform Downloader v${{ steps.version.outputs.version }}
          body: |
            Windows / macOS 下载器 v${{ steps.version.outputs.version }}（YouTube / Bilibili / TikTok）

            ## 下载
            | 平台 | 文件 |
            |------|------|
            | Windows (x64) | `YouTubeDownloader-Windows.exe`（内嵌 ffmpeg / ffprobe / deno） |
            | macOS (Apple Silicon) | `YouTubeDownloader-macOS.zip`（解压后打开 `.app`；内嵌 ffmpeg / ffprobe / deno） |
            | 校验 | `SHA256SUMS.txt`（应用内更新会自动校验） |

            ## 本版亮点
            - **应用内更新**：设置页「检查更新」一键下载、替换、重启（附 sha256 校验、失败回滚）
            - **活动下载队列**：下载中可继续「加入队列」/粘贴新 ID，任务立刻接着跑
            - **应用图标**：Windows `.ico`、macOS `.icns`、窗口图标统一
            - 修复进度条因续传跳过而到不了 100%、安装更新时后台线程未停等问题

            完整变更见 [`CHANGELOG.md`](https://github.com/Jqsfree/youtube_down/blob/main/CHANGELOG.md)。

            > 从 v1.2.0 及更早版本升级需手动下载本版一次，之后即可在软件内更新。

            ## 使用
            ### Windows
            1. 下载 `YouTubeDownloader-Windows.exe`
            2. 双击运行

            ### macOS
            1. 下载并解压 `YouTubeDownloader-macOS.zip`
            2. 首次打开若提示未验证：右键 → 打开，或在「系统设置 → 隐私与安全性」允许
            3. 会员/风控视频请按平台导入 Cookie
          files: staged/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
