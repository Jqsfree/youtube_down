name: Build Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: YouTubeDownloader-Windows.exe
            pyinstaller_name: YouTubeDownloader-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
          pip install -U yt-dlp yt-dlp-ejs

      - name: Run unit tests
        shell: bash
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      # After tests: local ffmpeg.exe would otherwise shadow PATH in tool-resolution tests.
      - name: Install deno + ffmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .
          if (-not (Test-Path deno.exe)) {
            Get-ChildItem -Recurse -Filter deno.exe | Select-Object -First 1 | Move-Item -Destination deno.exe
          }
          # BtbN builds are more reliable than gyan.dev on CI
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Copy-Item "$($ffmpegDir.Name)\bin\ffmpeg.exe" ffmpeg.exe
          Copy-Item "$($ffmpegDir.Name)\bin\ffprobe.exe" ffprobe.exe
          if (-not (Test-Path ffmpeg.exe)) { throw "ffmpeg.exe missing after extract" }

      - name: Smoke test
        shell: bash
        run: python smoke_test.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build EXE (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name "${{ matrix.pyinstaller_name }}" `
            --add-data "VERSION;." `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-binary "deno.exe;." `
            --collect-all yt_dlp `
            --collect-all yt_dlp_ejs `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtGui `
            --hidden-import platforms `
            --hidden-import platforms.youtube `
            --hidden-import platforms.bilibili `
            --hidden-import platforms.tiktok `
            --hidden-import theme `
            --hidden-import yt_dlp_updater `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pyinstaller_name }}-v${{ steps.version.outputs.version }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Stage release files
        id: stage
        run: |
          mkdir -p staged
          find release-assets -type f \( -name 'YouTubeDownloader-*' -o -name '*.exe' \) -print
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp "$f" "staged/$base"
          done < <(find release-assets -type f -name 'YouTubeDownloader-Windows.exe' -print0)
          ls -la staged
          echo "files=$(find staged -type f | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Multi-Platform Downloader v${{ steps.version.outputs.version }}
          body: |
            Windows 下载器 v${{ steps.version.outputs.version }}（YouTube / Bilibili / TikTok）

            ## 下载
            | 平台 | 文件 |
            |------|------|
            | Windows | `YouTubeDownloader-Windows.exe`（内嵌 ffmpeg / ffprobe / deno） |

            ## 本版修复
            - 竖屏/横屏按短边计档；缺 width 时从 resolution 解析，避免有 720 却误跳过
            - 合并音频优先 m4a/AAC，避免 opus 进 mp4 后 Windows 播放器无声
            - 格式选择兼容 m4s/fmp4 容器

            ## 使用
            1. 下载 `YouTubeDownloader-Windows.exe`
            2. 双击运行
            3. 会员/风控视频请按平台导入 Cookie
          files: staged/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
