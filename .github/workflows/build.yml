name: Build Multi-Platform

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag (empty means build current ref only)'
        type: string
        default: ''
      check_install:
        description: 'Exercise native installer using v1.3.1 and the new real artifact'
        type: boolean
        default: false
      create_draft:
        description: 'Create a draft release for the supplied existing tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          RELEASE_TAG="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then RELEASE_TAG="$GITHUB_REF_NAME"; fi
          if [ "$CREATE_DRAFT" = true ] && [ -z "$RELEASE_TAG" ]; then
            echo 'Draft creation requires an existing version tag' >&2
            exit 1
          fi
          VERSION=$(python scripts/release_checks.py version --tag "$RELEASE_TAG")
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tools_platform: Windows
            artifact_name: YouTubeDownloader-Windows.exe
            pyinstaller_name: YouTubeDownloader-Windows
          - os: macos-latest
            platform: macos
            tools_platform: macOS
            artifact_name: YouTubeDownloader-macOS.zip
            pyinstaller_name: YouTubeDownloader-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.8'
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Run offline tests
        run: uv run --no-sync python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen
      # Tools must be installed after resolution tests so local binaries cannot shadow fixtures.
      - name: Install pinned external tools
        run: uv run --no-sync python scripts/build_tools.py install --platform ${{ matrix.tools_platform }}

      - name: Build EXE (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          uv run --no-sync pyinstaller --onefile --windowed `
            --name "${{ matrix.pyinstaller_name }}" `
            --icon "assets\icon.ico" `
            --add-data "VERSION;." `
            --add-data "assets;assets" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-binary "deno.exe;." `
            --collect-all yt_dlp `
            --collect-all yt_dlp_ejs `
            --collect-all curl_cffi `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtGui `
            --hidden-import platforms `
            --hidden-import platforms.youtube `
            --hidden-import platforms.bilibili `
            --hidden-import platforms.tiktok `
            --hidden-import theme `
            --hidden-import pacing `
            --hidden-import gui_log `
            --hidden-import batch_io `
            --hidden-import yt_dlp_updater `
            main.py

      - name: Build app (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macOS 用 onedir：onefile + .app 已被 PyInstaller 标记弃用（v7 报错），
          # 且每次启动都要解包上百 MB。打出来的 zip 体积基本一致。
          uv run --no-sync pyinstaller --onedir --windowed \
            --name "${{ matrix.pyinstaller_name }}" \
            --osx-bundle-identifier "com.jqsfree.youtubedownloader" \
            --icon "assets/icon.icns" \
            --add-data "VERSION:." \
            --add-data "assets:assets" \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            --add-binary "deno:." \
            --collect-all yt_dlp \
            --collect-all yt_dlp_ejs \
            --collect-all curl_cffi \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtGui \
            --hidden-import platforms \
            --hidden-import platforms.youtube \
            --hidden-import platforms.bilibili \
            --hidden-import platforms.tiktok \
            --hidden-import theme \
            --hidden-import pacing \
            --hidden-import gui_log \
            --hidden-import batch_io \
            --hidden-import yt_dlp_updater \
            main.py
          ls -la dist/
          # --windowed on macOS → .app; zip for release download
          if [ -d "dist/${{ matrix.pyinstaller_name }}.app" ]; then
            ditto -c -k --keepParent \
              "dist/${{ matrix.pyinstaller_name }}.app" \
              "dist/${{ matrix.artifact_name }}"
          elif [ -f "dist/${{ matrix.pyinstaller_name }}" ]; then
            ditto -c -k \
              "dist/${{ matrix.pyinstaller_name }}" \
              "dist/${{ matrix.artifact_name }}"
          else
            echo "No macOS build output found in dist/" >&2
            exit 1
          fi
          ls -la "dist/${{ matrix.artifact_name }}"

      - name: Verify embedded tools and record build sources
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            uv run --no-sync python scripts/build_tools.py verify --platform Windows --bundle "dist/${{ matrix.artifact_name }}" --asset "dist/${{ matrix.artifact_name }}"
          else
            uv run --no-sync python scripts/build_tools.py verify --platform macOS --bundle "dist/${{ matrix.pyinstaller_name }}.app" --asset "dist/${{ matrix.artifact_name }}"
          fi

      - name: Exercise native upgrade and rollback
        if: inputs.check_install || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p upgrade-old
          gh release download v1.3.1 --pattern "${{ matrix.artifact_name }}" --dir upgrade-old
          uv run --no-sync python scripts/check_install.py --old "upgrade-old/${{ matrix.artifact_name }}" --new "dist/${{ matrix.artifact_name }}"

      - name: Write checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Write checksums (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd dist
          shasum -a 256 "${{ matrix.artifact_name }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pyinstaller_name }}-v${{ needs.validate.outputs.version }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/SHA256SUMS.txt
            dist/build-info-*.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Validate and stage release assets
        run: |
          python scripts/release_checks.py stage
          python scripts/release_checks.py notes
      - name: Create new draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python scripts/release_checks.py ensure-absent --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
            --title "Multi-Platform Downloader $RELEASE_TAG" \
            --notes-file staged/RELEASE_NOTES.md \
            staged/YouTubeDownloader-Windows.exe staged/YouTubeDownloader-macOS.zip \
            staged/SHA256SUMS.txt staged/build-info-Windows.json staged/build-info-macOS.json
