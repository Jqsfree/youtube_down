name: Local media test for v1.5.2
on:
  push:
    branches:
      - release-cut/v1.5.2-20261105
    paths:
      - .github/workflows/local-media-v1.5.2.yml
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-cut/v1.5.2-20261105
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.8'
      - run: uv sync --locked
      - name: Install platform tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PLATFORM=Windows; else PLATFORM=macOS; fi
          uv run --no-sync python scripts/build_tools.py install --platform "$PLATFORM"
      - name: Transfer test from localhost HTTP
        shell: bash
        env:
          NO_PROXY: 127.0.0.1,localhost
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python -m scripts.local_media_release_check
