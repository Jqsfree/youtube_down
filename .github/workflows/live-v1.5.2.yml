name: v1.5.2 cross-platform real media E2E dispatch (one-time)
on:
  push:
    branches:
      - release-cut/v1.5.2-20261105
    paths:
      - .github/workflows/live-v1.5.2.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'Jqsfree/youtube_down'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require tagged candidate main SHA and dispatch E2E
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "61a1f3f5811e62d4a7b228693f38b19e50dda542"
          gh workflow run real-download.yml -R Jqsfree/youtube_down --ref main \
            -f "video_url=https://www.youtube.com/watch?v=O8G5Mkzhe4s"
          echo "Real download acceptance dispatched; check actual Windows/macOS results separately."
