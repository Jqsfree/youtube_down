[project]
name = "youtube-down"
version = "1.4.0"
description = "多平台批量视频下载器（yt-dlp + PySide6，CSV/文件夹导入、断点续传）"
readme = "README.md"
authors = [
    { name = "Jqsfree", email = "jiangqjnshenlsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.5.0",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
youtube-down = "main:main"
youtube-down-cli = "download_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app_updater",
    "batch_io",
    "download_cli",
    "downloader",
    "cookies",
    "media_probe",
    "download_errors",
    "gui",
    "gui_log",
    "logger_utils",
    "main",
    "pacing",
    "private_files",
    "theme",
    "worker",
    "batch_runner",
    "yt_dlp_updater",
]
packages = ["platforms"]

[dependency-groups]
dev = ["pytest==9.1.1", "pyyaml>=6,<7"]
build = ["pyinstaller==6.22.3"]
