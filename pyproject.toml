[project]
name = "youtube-down"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jqsfree", email = "jiangqjnshenlsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "pyside6>=6.5.0",
    "requests>=2.28.0",
    "yt-dlp>=2024.1.1",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
youtube-down = "main:main"
youtube-down-cli = "download_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "batch_io",
    "download_cli",
    "downloader",
    "gui",
    "gui_log",
    "logger_utils",
    "main",
    "pacing",
    "theme",
    "worker",
    "yt_dlp_updater",
]
packages = ["platforms"]
